<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meeting Map Dashboard</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Leaflet MarkerCluster CSS (Handles the overlapping dots natively) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

    <style>
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body, html { margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden; display: flex; }

        /* --- LEFT PANE (Controls & List) --- */
        #left-pane { width: 350px; min-width: 350px; height: 100vh; background: #ffffff; box-shadow: 2px 0 10px rgba(0,0,0,0.1); z-index: 1000; display: flex; flex-direction: column; }
        
        #controls-section { padding: 20px; border-bottom: 1px solid #e5e7eb; background: #f9fafb; }
        #controls-section h3 { margin: 0 0 10px 0; font-size: 16px; color: #111; }
        
        #active-indicator { margin-bottom: 15px; padding: 10px; border-radius: 6px; font-size: 13px; font-weight: 600; background: #e5e7eb; color: #374151; border: 1px solid #d1d5db; }

        .btn-group { display: flex; gap: 8px; margin-bottom: 15px; }
        .btn { flex: 1; padding: 8px; border: none; border-radius: 6px; background: #e5e7eb; color: #374151; cursor: pointer; font-weight: 500; transition: background 0.2s; }
        .btn:hover { background: #d1d5db; }
        .btn.active { background: #2563eb; color: white; }

        .export-btn { width: 100%; padding: 12px; background: #16a34a; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; margin-top: 10px; }
        .export-btn:hover { background: #15803d; }
        
        input[type="file"] { display: block; width: 100%; font-size: 13px; margin-top: 10px; }
        #skipped-warning { margin-top: 10px; font-size: 12px; color: #dc2626; font-weight: 600; display: none; }

        /* The Clickable List */
        #list-section { flex-grow: 1; overflow-y: auto; padding: 10px 0; }
        .list-item { padding: 12px 20px; border-bottom: 1px solid #f3f4f6; cursor: pointer; display: flex; align-items: center; gap: 12px; }
        .list-item:hover { background: #f9fafb; }
        .list-item.active { background: #eff6ff; border-left: 4px solid #2563eb; padding-left: 16px; }
        .list-number { background: #2563eb; color: white; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; flex-shrink: 0; }
        .list-item.active .list-number { background: #dc2626; }
        .list-text { font-size: 14px; color: #111; font-weight: 500; }

        /* --- CENTER MAP --- */
        #map-container { flex-grow: 1; height: 100vh; position: relative; }
        #map { height: 100%; width: 100%; z-index: 1; }

        /* Only specific markers get this style, Clusters use their own default green/yellow style */
        .custom-marker { background-color: #2563eb; color: white; border-radius: 50%; border: 2px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 12px; transition: all 0.2s ease-out; }
        .custom-marker.active { background-color: #dc2626; z-index: 1000 !important; font-size: 16px; border: 3px solid white; }

        /* --- RIGHT PANE (Data Editor) --- */
        #right-pane { width: 400px; min-width: 400px; height: 100vh; background: #ffffff; box-shadow: -2px 0 10px rgba(0,0,0,0.1); z-index: 1000; display: flex; flex-direction: column; transform: translateX(100%); display: none; transition: transform 0.3s ease; }
        #right-pane.active { display: flex; transform: translateX(0); }

        #right-header { padding: 20px; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; background: #f9fafb; }
        #right-title { margin: 0; font-size: 18px; color: #111; display: flex; align-items: center; gap: 10px; }
        .close-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: #888; }
        
        #right-content { flex-grow: 1; overflow-y: auto; padding: 20px; }
        
        .data-row { margin-bottom: 14px; }
        .data-label { font-size: 11px; text-transform: uppercase; color: #6b7280; font-weight: 700; margin-bottom: 6px; }
        .data-input { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; color: #111; background: #f9fafb; }
        textarea.data-input { resize: vertical; min-height: 80px; }
        .data-input:focus { outline: none; border-color: #2563eb; background: #fff; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
        
        .section-divider { margin: 25px 0 15px 0; padding-bottom: 5px; border-bottom: 2px solid #e5e7eb; font-size: 12px; font-weight: bold; color: #4b5563; text-transform: uppercase; letter-spacing: 1px; }
        #save-status { background: #10b981; color: white; text-align: center; padding: 10px; font-size: 13px; font-weight: 600; opacity: 0; transition: opacity 0.3s; }

        /* Custom Modal Overlay styles */
        #modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); z-index: 9999; display: none; align-items: center; justify-content: center; backdrop-filter: blur(3px); }
        .modal-box { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 400px; text-align: center; }
        .modal-box h3 { margin: 0 0 15px 0; color: #111; font-size: 18px; }
        .modal-box p { color: #4b5563; font-size: 14px; margin-bottom: 20px; line-height: 1.5; }
        .modal-btn-group { display: flex; gap: 10px; justify-content: center; }
        .modal-btn { padding: 10px 20px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .modal-btn-cancel { background: #e5e7eb; color: #374151; }
        .modal-btn-cancel:hover { background: #d1d5db; }
        .modal-btn-danger { background: #dc2626; color: white; }
        .modal-btn-danger:hover { background: #b91c1c; }
    </style>
</head>
<body>

    <!-- LEFT PANE -->
    <div id="left-pane">
        <div id="controls-section">
            <h3>Map Datasets</h3>
            <div id="active-indicator">Status: Waiting for data...</div>
            <div class="btn-group">
                <button class="btn" onclick="requestDatasetLoad('dataset1.xlsx', 'Map 1', this)">Map 1</button>
                <button class="btn" onclick="requestDatasetLoad('dataset2.xlsx', 'Map 2', this)">Map 2</button>
                <button class="btn" onclick="requestDatasetLoad('dataset3.xlsx', 'Map 3', this)">Map 3</button>
            </div>
            <input type="file" id="excel-file" accept=".xlsx, .xls, .csv" />
            <button class="export-btn" onclick="exportData()">💾 Export Meeting Data</button>
            <div id="skipped-warning"></div>
        </div>
        <div id="list-section"></div>
    </div>

    <!-- CENTER MAP -->
    <div id="map-container">
        <div id="map"></div>
    </div>

    <!-- RIGHT PANE -->
    <div id="right-pane">
        <div id="right-header">
            <h2 id="right-title"><span id="header-number" class="list-number"></span><span id="header-text">Details</span></h2>
            <button class="close-btn" onclick="closeRightPane()">&times;</button>
        </div>
        <div id="save-status">💾 Live changes saved</div>
        <div id="right-content"></div>
    </div>

    <!-- Custom Safety Modal -->
    <div id="modal-overlay">
        <div class="modal-box">
            <h3>Unsaved Changes!</h3>
            <p>You have made edits to the current data. If you load a new map now, you will lose your meeting notes. Do you want to discard them?</p>
            <div class="modal-btn-group">
                <button class="modal-btn modal-btn-cancel" onclick="closeModal()">Go Back</button>
                <button class="modal-btn modal-btn-danger" onclick="confirmDiscard()">Discard Changes</button>
            </div>
        </div>
    </div>

    <!-- Core Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <!-- MarkerCluster Script -->
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

    <script>
        const map = L.map('map').setView([20, 0], 2);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
        
        // MarkerClusterGroup handles overlaps with Leaflet's default green/yellow/red styling
        const markerGroup = L.markerClusterGroup({
            maxClusterRadius: 40, 
            spiderfyOnMaxZoom: true,
            showCoverageOnHover: false,
            zoomToBoundsOnClick: true
        }).addTo(map);

        let currentData = [];
        let currentFilename = "Meeting_Export.xlsx";
        let activeIndex = null; 
        let mapMarkers = {}; 
        let hasUnsavedChanges = false;
        
        // Modal State Variables
        let pendingAction = null; 

        // Block accidental tab closures
        window.addEventListener('beforeunload', function (e) {
            if (hasUnsavedChanges) {
                e.preventDefault();
                e.returnValue = ''; 
            }
        });

        // --- Custom Modal Logic ---
        function showModal(action) {
            pendingAction = action;
            document.getElementById('modal-overlay').style.display = 'flex';
        }

        function closeModal() {
            pendingAction = null;
            document.getElementById('modal-overlay').style.display = 'none';
        }

        function confirmDiscard() {
            document.getElementById('modal-overlay').style.display = 'none';
            hasUnsavedChanges = false;
            if (pendingAction) pendingAction();
        }

        // --- Parsing Logic ---
        function parseCoordinates(locStr) {
            if (!locStr) return null;
            const dmsRegex = /^\s*(\d+)\s+(\d+)\s*([\d.]+)?\s*([NSns])\s+(\d+)\s+(\d+)\s*([\d.]+)?\s*([EWew])\s*$/;
            const match = locStr.match(dmsRegex);
            if (match) {
                let lat = parseFloat(match[1]) + (parseFloat(match[2]) / 60) + (parseFloat(match[3] || 0) / 3600);
                if (match[4].toUpperCase() === 'S') lat *= -1;
                let lng = parseFloat(match[5]) + (parseFloat(match[6]) / 60) + (parseFloat(match[7] || 0) / 3600);
                if (match[8].toUpperCase() === 'W') lng *= -1;
                return { lat, lng };
            }
            if (locStr.includes(',')) {
                const parts = locStr.split(',');
                if (parts.length === 2) {
                    const lat = parseFloat(parts[0].trim());
                    const lng = parseFloat(parts[1].trim());
                    if (!isNaN(lat) && !isNaN(lng)) return { lat, lng };
                }
            }
            return null; 
        }

        function getMarkerIcon(number, isActive) {
            const size = isActive ? 45 : 30; 
            return L.divIcon({ className: `custom-marker ${isActive ? 'active' : ''}`, html: `<div>${number}</div>`, iconSize: [size, size], iconAnchor: [size/2, size/2] });
        }

        function setActiveIndicator(text, type) {
            const ind = document.getElementById('active-indicator');
            ind.innerText = text;
            if (type === 'cloud') {
                ind.style.background = '#dbeafe'; ind.style.color = '#1e3a8a'; ind.style.borderColor = '#bfdbfe';
            } else if (type === 'manual') {
                ind.style.background = '#fef08a'; ind.style.color = '#854d0e'; ind.style.borderColor = '#fde047';
            }
        }

        // --- File Loading ---
        function requestDatasetLoad(filename, mapLabel, btnElement) {
            if (hasUnsavedChanges) {
                showModal(() => loadDataset(filename, mapLabel, btnElement));
            } else {
                loadDataset(filename, mapLabel, btnElement);
            }
        }

        async function loadDataset(filename, mapLabel, btnElement) {
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');
            setActiveIndicator(`Loading ${filename}...`, 'cloud');
            try {
                // Cache-busting parameter to ensure we pull the freshest file from GitHub
                const response = await fetch(filename + '?t=' + new Date().getTime());
                if (!response.ok) throw new Error("Not found");
                const arrayBuffer = await response.arrayBuffer();
                parseWorkbook(arrayBuffer, filename);
                setActiveIndicator(`Active: ${mapLabel} (${filename})`, 'cloud');
                hasUnsavedChanges = false;
            } catch (error) {
                setActiveIndicator(`Failed to load: ${filename}`, 'manual');
            }
        }

        document.getElementById('excel-file').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const handleFile = () => {
                document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
                setActiveIndicator(`Active: Manual Upload (${file.name})`, 'manual');
                const reader = new FileReader();
                reader.onload = (evt) => {
                    parseWorkbook(evt.target.result, file.name);
                    hasUnsavedChanges = false;
                }
                reader.readAsArrayBuffer(file);
            };

            if (hasUnsavedChanges) {
                showModal(handleFile);
                e.target.value = ''; // Reset input so it can be re-selected if user cancels
            } else {
                handleFile();
            }
        });

        function parseWorkbook(dataBuffer, filename) {
            currentFilename = filename;
            const workbook = XLSX.read(dataBuffer, {type: 'array'});
            // {defval: ""} captures blank columns like "is SAM?" perfectly
            currentData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], {defval: ""});
            closeRightPane();
            processData();
        }

        // --- Data Processing & UI ---
        function processData() {
            markerGroup.clearLayers();
            mapMarkers = {};
            document.getElementById('list-section').innerHTML = '';
            
            let displayNum = 1; 
            let skippedCount = 0; 

            currentData.forEach((row, dataIndex) => {
                const locStr = row.Location || row.location;
                const coords = parseCoordinates(locStr);
                
                if (coords) {
                    const currentNum = displayNum; 
                    const title = row["Platform Name"] || row.Field || row.Label || row["OED ID"] || `Location ${currentNum}`;
                    
                    const marker = L.marker([coords.lat, coords.lng], { icon: getMarkerIcon(currentNum, false) });
                    
                    marker.on('click', () => selectLocation(dataIndex, currentNum, coords));
                    markerGroup.addLayer(marker);
                    mapMarkers[dataIndex] = marker;

                    const listItem = document.createElement('div');
                    listItem.className = 'list-item';
                    listItem.id = `list-item-${dataIndex}`;
                    listItem.innerHTML = `<div class="list-number">${currentNum}</div><div class="list-text">${title}</div>`;
                    listItem.onclick = () => selectLocation(dataIndex, currentNum, coords);
                    document.getElementById('list-section').appendChild(listItem);

                    displayNum++;
                } else {
                    skippedCount++; 
                }
            });

            const warnEl = document.getElementById('skipped-warning');
            if (skippedCount > 0) {
                warnEl.innerText = `⚠️ ${skippedCount} rows skipped (missing/invalid "Location" coordinates)`;
                warnEl.style.display = 'block';
            } else {
                warnEl.style.display = 'none';
            }

            if (displayNum > 1) {
                map.fitBounds(markerGroup.getBounds(), { padding: [50, 50] });
            }
        }

        function selectLocation(dataIndex, number, coords) {
            if (activeIndex !== null && mapMarkers[activeIndex]) {
                const oldNum = document.querySelector(`#list-item-${activeIndex} .list-number`).innerText;
                mapMarkers[activeIndex].setIcon(getMarkerIcon(oldNum, false));
                document.getElementById(`list-item-${activeIndex}`).classList.remove('active');
            }
            activeIndex = dataIndex;
            
            const targetMarker = mapMarkers[dataIndex];
            targetMarker.setIcon(getMarkerIcon(number, true));
            document.getElementById(`list-item-${dataIndex}`).classList.add('active');
            
            buildRightPane(dataIndex, number);

            // Smart zoom logic (Cluster awareness vs standard country zoom)
            const parentCluster = markerGroup.getVisibleParent(targetMarker);
            if (parentCluster && parentCluster !== targetMarker) {
                markerGroup.zoomToShowLayer(targetMarker, function() {
                    map.panTo([coords.lat, coords.lng]);
                });
            } else {
                map.flyTo([coords.lat, coords.lng], 5, { duration: 0.5 });
            }
        }

        function buildRightPane(dataIndex, number) {
            const rowData = currentData[dataIndex];
            document.getElementById('header-number').innerText = number;
            document.getElementById('header-text').innerText = rowData["Platform Name"] || rowData.Field || rowData.Label || 'Details';
            
            let html = '';
            for (const key in rowData) {
                const val = rowData[key] || '';
                if (key.startsWith('---')) {
                    html += `<div class="section-divider">${key.replace(/---/g, '').trim()}</div>`;
                    continue; 
                }
                if (key.trim() === '') continue;

                const isNotes = key.toLowerCase().includes('note') || key.toLowerCase().includes('action');
                html += `
                    <div class="data-row">
                        <div class="data-label">${key}</div>
                        ${isNotes ? `<textarea class="data-input" onchange="updateData(${dataIndex}, '${key}', this.value)">${val}</textarea>` : `<input type="text" class="data-input" value="${val}" onchange="updateData(${dataIndex}, '${key}', this.value)">`}
                    </div>`;
            }
            document.getElementById('right-content').innerHTML = html;
            document.getElementById('right-pane').classList.add('active');
        }

        function closeRightPane() {
            document.getElementById('right-pane').classList.remove('active');
            if (activeIndex !== null && mapMarkers[activeIndex]) {
                const num = document.querySelector(`#list-item-${activeIndex} .list-number`).innerText;
                mapMarkers[activeIndex].setIcon(getMarkerIcon(num, false));
                document.getElementById(`list-item-${activeIndex}`).classList.remove('active');
                activeIndex = null;
            }
        }

        function updateData(dataIndex, key, newValue) {
            currentData[dataIndex][key] = newValue;
            hasUnsavedChanges = true; 
            const status = document.getElementById('save-status');
            status.style.opacity = 1;
            setTimeout(() => { status.style.opacity = 0; }, 2000);
            if (key.toLowerCase() === 'location') processData();
        }

        function exportData() {
            if (currentData.length === 0) return;
            const worksheet = XLSX.utils.json_to_sheet(currentData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Meeting Notes");
            XLSX.writeFile(workbook, "Updated_" + currentFilename);
            hasUnsavedChanges = false;
        }
    </script>
</body>
</html>
