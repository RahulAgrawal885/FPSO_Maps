<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FPSO Opportunity Map</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --tam: #94a3b8; --sam: #4f46e5; --som: #059669; --out: #cbd5e1;
    --ink: #0f172a; --muted: #64748b; --line: #e2e8f0; --bg: #f8fafc;
    --navy: #0b1b33;
  }
  * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
  .app { display: grid; grid-template-rows: auto auto 1fr; height: 100vh; }

  /* Header */
  header { background: var(--navy); color: #fff; display: flex; align-items: center; gap: 16px; padding: 12px 20px; }
  header .mark { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, #22d3ee, #4f46e5); }
  header h1 { font-size: 16px; margin: 0; font-weight: 700; }
  header .sub { font-size: 12px; color: #94a3b8; }
  header .spacer { flex: 1; }
  .seg { display: inline-flex; background: rgba(255,255,255,.08); border-radius: 8px; padding: 3px; }
  .seg button { border: 0; background: transparent; color: #cbd5e1; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; }
  .seg button.on { background: #fff; color: var(--navy); }
  .hbtn { border: 1px solid rgba(255,255,255,.2); background: transparent; color: #fff; padding: 7px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
  .hbtn.primary { background: #22d3ee; color: var(--navy); border-color: #22d3ee; }

  /* Funnel strip: nested stages, each narrower than the one before */
  .funnel { display: flex; align-items: stretch; gap: 0; padding: 14px 20px; background: #fff; border-bottom: 1px solid var(--line); }
  .stage { position: relative; padding: 12px 16px 12px 30px; cursor: pointer; color: #fff; background: var(--c);
           clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 50%, calc(100% - 18px) 100%, 0 100%, 18px 50%); margin-right: -10px; transition: filter .15s, opacity .15s; }
  .stage:first-child { clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 50%, calc(100% - 18px) 100%, 0 100%); padding-left: 18px; border-radius: 12px 0 0 12px; }
  .stage:hover { filter: brightness(1.08); }
  .stage.dim { opacity: .35; }
  .stage .lab { font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; opacity: .9; white-space: nowrap; }
  .stage .lab em { font-style: normal; font-weight: 500; text-transform: none; letter-spacing: 0; opacity: .85; margin-left: 6px; }
  .stage .big { font-size: 28px; font-weight: 800; line-height: 1.15; margin-top: 2px; white-space: nowrap; }
  .stage .big small { font-size: 13px; font-weight: 600; opacity: .85; margin-left: 6px; }
  .stage .conv { font-size: 11px; font-weight: 600; opacity: .9; margin-top: 2px; white-space: nowrap; }
  .stage.tam { --c: #64748b; }
  .stage.sam { --c: var(--sam); }
  .stage.som { --c: var(--som); }
  .outside { margin-left: 26px; border: 1px dashed #cbd5e1; border-radius: 12px; padding: 12px 16px; cursor: pointer; min-width: 150px; }
  .outside.dim { opacity: .35; }
  .outside .lab { font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--muted); }
  .outside .big { font-size: 28px; font-weight: 800; line-height: 1.15; margin-top: 2px; }
  .outside .conv { font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* Logos */
  .logo { position: relative; display: inline-grid; place-items: center; flex-shrink: 0; border-radius: 50%; background: var(--lc, #334155); color: #fff; font-weight: 800; overflow: hidden; }
  .logo img { visibility: hidden; position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #fff; padding: 12%; }
  .logo img.ok { visibility: visible; }
  .logo.sq { border-radius: 10px; }

  /* Body */
  .body { display: grid; grid-template-columns: 320px 1fr; min-height: 0; position: relative; }
  aside { background: #fff; border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .filters { padding: 14px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
  .search { width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 13px; background: var(--bg); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 11px; font-weight: 600; padding: 5px 9px; border-radius: 999px; border: 1px solid var(--line); background: #fff; color: #334155; cursor: pointer; }
  .chip.on { background: var(--navy); color: #fff; border-color: var(--navy); }
  .flabel { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; }
  .list { overflow-y: auto; flex: 1; }
  .row { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; padding: 10px 16px; border-bottom: 1px solid #f1f5f9; cursor: pointer; }
  .row:hover { background: var(--bg); }
  .row.on { background: #eef2ff; box-shadow: inset 3px 0 0 var(--sam); }
  .row .t { font-size: 13px; font-weight: 600; line-height: 1.25; }
  .row .m { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .row .v { font-size: 12px; font-weight: 700; color: #334155; text-align: right; }
  .pips { display: flex; gap: 3px; justify-content: flex-end; margin-top: 4px; }
  .pips i { width: 14px; height: 4px; border-radius: 2px; background: #e2e8f0; }
  .pips i.f1 { background: var(--tam); } .pips i.f2 { background: var(--sam); } .pips i.f3 { background: var(--som); }

  #map { height: 100%; width: 100%; }
  .legend { position: absolute; right: 16px; top: 16px; z-index: 500; background: rgba(255,255,255,.96); border-radius: 12px; padding: 12px 14px; box-shadow: 0 4px 16px rgba(15,23,42,.12); font-size: 11px; display: flex; gap: 12px; align-items: center; }
  .legend .rows { display: grid; gap: 4px; font-weight: 600; }
  .legend .rows span { display: flex; align-items: center; gap: 6px; }
  .legend .rows i { width: 10px; height: 10px; border-radius: 50%; border: 3px solid var(--c); background: #fff; }
  .legend .note { color: var(--muted); font-weight: 500; margin-top: 4px; }

  /* Pins */
  .pin { border-radius: 50%; border: 3.5px solid var(--c); background: #fff; box-shadow: 0 2px 8px rgba(15,23,42,.35); display: grid; place-items: center; transition: transform .15s; overflow: hidden; }
  .pin.out { border-style: dashed; border-color: #94a3b8; }
  .pin.sel { outline: 4px solid rgba(34,211,238,.6); transform: scale(1.25); }
  .pin .logo { width: 100%; height: 100%; }
  .pin .logo img { padding: 14%; }
  .leaflet-tooltip.tip { border: 0; border-radius: 8px; box-shadow: 0 6px 20px rgba(15,23,42,.18); padding: 8px 10px; }
  .tip b { font-size: 12px; } .tip div { font-size: 11px; color: var(--muted); }

  /* Detail card */
  .detail { position: absolute; top: 16px; right: 16px; bottom: 16px; width: 370px; z-index: 600; background: #fff; border-radius: 14px; box-shadow: 0 12px 40px rgba(15,23,42,.22); display: none; flex-direction: column; overflow: hidden; }
  .detail.on { display: flex; }
  .dh { padding: 16px 18px; background: var(--navy); color: #fff; }
  .dh .top { display: flex; gap: 12px; align-items: center; }
  .dh h2 { margin: 0; font-size: 17px; line-height: 1.25; }
  .dh .loc { font-size: 12px; color: #94a3b8; margin-top: 3px; }
  .dh .x { margin-left: auto; align-self: start; background: none; border: 0; color: #94a3b8; font-size: 22px; cursor: pointer; line-height: 1; }
  .flab { font-size: 10px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: #94a3b8; margin: 16px 0 6px; display: flex; justify-content: space-between; }
  .flab kbd { font-family: inherit; font-weight: 500; letter-spacing: 0; text-transform: none; }
  .ladder { display: flex; }
  .ladder button { flex: 1; border: 0; padding: 9px 0 9px 8px; margin-right: -8px; font-weight: 700; font-size: 12px; cursor: pointer; background: rgba(255,255,255,.1); color: #94a3b8;
                   clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 50%, calc(100% - 10px) 100%, 0 100%, 10px 50%); }
  .ladder button:first-child { clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 50%, calc(100% - 10px) 100%, 0 100%); border-radius: 8px 0 0 8px; padding-left: 0; }
  .ladder button:hover { color: #fff; }
  .ladder button.f { background: var(--c); color: #fff; }
  .ladder button.out.f { background: #475569; }
  .ticks { display: flex; gap: 14px; font-size: 11px; color: #cbd5e1; margin-top: 8px; }
  .ticks b { color: #fff; }
  .db { padding: 16px 18px; overflow-y: auto; flex: 1; }
  .parties { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .party { display: flex; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
  .party .k { font-size: 10px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); font-weight: 700; }
  .party .n { font-size: 13px; font-weight: 700; line-height: 1.2; }
  .party .n.tbd { color: var(--muted); font-weight: 500; font-style: italic; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tile { background: var(--bg); border-radius: 10px; padding: 10px 12px; }
  .tile .k { font-size: 10px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); font-weight: 700; }
  .tile .val { font-size: 15px; font-weight: 700; margin-top: 2px; }
  .status { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: #fef3c7; color: #92400e; }
  .sect { margin: 16px 0 8px; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; }
  textarea { width: 100%; min-height: 80px; border: 1px solid var(--line); border-radius: 8px; padding: 10px; font-size: 13px; resize: vertical; }
  details { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 10px; font-size: 12px; }
  details summary { cursor: pointer; font-weight: 600; color: #334155; }
  .kv { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; margin-top: 8px; }
  .kv span:nth-child(odd) { color: var(--muted); }
  .df { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--muted); }
  .df button { border: 0; background: var(--navy); color: #fff; padding: 8px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; }

  /* Compare mode */
  .picks { display: flex; gap: 8px; flex-wrap: wrap; }
  .pick { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.08); border-radius: 8px; padding: 4px 4px 4px 10px; font-size: 11px; color: #94a3b8; }
  .pick select { border: 0; border-radius: 6px; background: #fff; color: var(--navy); font-size: 12px; font-weight: 600; padding: 6px 8px; max-width: 220px; cursor: pointer; }
  .dirty { color: #fbbf24; font-weight: 600; }
  .warn { color: #fca5a5; font-weight: 600; }
  .drop { position: fixed; inset: 0; z-index: 2000; display: none; place-items: center; background: rgba(11,27,51,.75); backdrop-filter: blur(2px); }
  .drop div { border: 3px dashed #22d3ee; border-radius: 18px; padding: 40px 48px; color: #fff; font-size: 20px; font-weight: 700; background: rgba(11,27,51,.6); }
  body.dragging .drop { display: grid; }
  .dlg { position: fixed; inset: 0; z-index: 2100; display: none; place-items: center; padding: 16px; background: rgba(11,27,51,.55); backdrop-filter: blur(2px); }
  .dlg.on { display: grid; }
  .dlg .box { background: #fff; border-radius: 14px; width: min(480px, 100%); padding: 20px 22px; box-shadow: 0 20px 50px rgba(15,23,42,.35); }
  .dlg h3 { margin: 0 0 12px; font-size: 17px; }
  .dlg p { font-size: 13px; color: #334155; line-height: 1.5; margin: 0 0 10px; }
  .checks { list-style: none; padding: 0; margin: 0 0 12px; display: grid; gap: 8px; }
  .checks li { display: grid; gap: 2px; padding: 10px 12px; border-radius: 10px; font-size: 13px; }
  .checks li.ok { background: #ecfdf5; } .checks li.ok b { color: #047857; }
  .checks li.bad { background: #fef2f2; } .checks li.bad b { color: #b91c1c; }
  .checks span { color: #334155; }
  .dlg .hint { color: var(--muted); font-size: 12px; }
  .dlg code { background: var(--bg); border-radius: 4px; padding: 1px 4px; font-size: 12px; }
  .dlg .btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .dlg button { border: 0; border-radius: 8px; padding: 9px 14px; font-weight: 600; font-size: 13px; cursor: pointer; background: var(--navy); color: #fff; }
  .dlg button.ghost { background: #f1f5f9; color: #334155; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 20px); z-index: 2050; width: min(560px, calc(100% - 32px)); background: var(--navy); color: #e2e8f0; font-size: 13px; line-height: 1.45; padding: 12px 16px; border-radius: 12px; box-shadow: 0 12px 30px rgba(15,23,42,.35); opacity: 0; pointer-events: none; transition: .25s; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .toast b { color: #fff; }
  .cmp-only { display: none; }
  body.cmp .cmp-only { display: flex; }
  .delta { display: inline-block; margin-top: 6px; font-size: 11px; font-weight: 700; background: rgba(255,255,255,.18); padding: 2px 7px; border-radius: 999px; }
  .outside .delta { background: #f1f5f9; color: #334155; }
  .pinwrap { position: relative; }
  .chg { position: absolute; top: -7px; right: -10px; font-size: 9px; font-weight: 800; line-height: 1; padding: 3px 5px; border-radius: 999px; color: #fff; background: var(--k); border: 2px solid #fff; box-shadow: 0 1px 4px rgba(15,23,42,.3); white-space: nowrap; }
  .pin.gone { opacity: .6; filter: grayscale(1); border-style: dashed; border-color: #94a3b8; }
  .row .cl2 { font-size: 11px; font-weight: 600; margin-top: 3px; color: var(--k); }
  .row.gone .t { text-decoration: line-through; color: var(--muted); }
  .since { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; background: #fffbeb; }
  .since.none { background: var(--bg); color: var(--muted); font-size: 12px; }
  .since .h { font-size: 10px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: #92400e; margin-bottom: 6px; }
  .since .d { display: grid; grid-template-columns: 110px 1fr; gap: 6px; font-size: 12px; padding: 3px 0; }
  .since .d span:first-child { color: var(--muted); }
  .since s { color: var(--muted); }
  .gonebar { margin-top: 14px; padding: 10px 12px; border-radius: 8px; background: rgba(239,68,68,.15); color: #fecaca; font-size: 12px; font-weight: 600; }

  /* Presentation mode */
  body.present aside, body.present .detail { display: none !important; }
  body.present .body { grid-template-columns: 1fr; }

  /* ---------- Responsive ---------- */
  /* Tablets and narrow windows: header wraps, funnel scrolls sideways, map above the list */
  @media (max-width: 900px) {
    html, body { overflow-x: hidden; overflow-y: auto; height: auto; }
    .app { height: auto; min-height: 100vh; }
    header { flex-wrap: wrap; gap: 10px; padding: 10px 14px; }
    header .spacer { display: none; }
    .funnel { overflow-x: auto; padding: 10px 14px; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
    .stage, .outside { scroll-snap-align: start; flex-shrink: 0; }
    .stage { min-width: 200px; }
    .outside { min-width: 150px; }
    .body { grid-template-columns: minmax(0, 1fr); grid-template-rows: 62vh auto; }
    .filters { grid-template-columns: minmax(0, 1fr); }
    aside, .filters > * { min-width: 0; }
    .body > div:nth-child(2) { order: -1; }
    aside { border-right: 0; border-top: 1px solid var(--line); }
    .list { overflow: visible; }
    .legend { display: none; }
    .detail { position: fixed; inset: auto 0 0 0; top: 12vh; width: auto; border-radius: 16px 16px 0 0; z-index: 1200; }
  }
  /* Phones */
  @media (max-width: 600px) {
    header { gap: 8px; }
    header h1 { font-size: 15px; }
    header .sub { font-size: 11px; }
    .picks { order: 5; width: 100%; }
    .pick { flex: 1 1 100%; justify-content: space-between; }
    .pick select { flex: 1; max-width: none; padding: 8px; }
    #present { display: none; }
    header > div:nth-child(2) { flex: 1 1 calc(100% - 50px); }   /* title takes the first row */
    #upload, #export { flex: 1; order: 4; padding: 9px 10px; }
    .stage { min-width: 168px; padding: 10px 14px 10px 26px; }
    .stage:first-child { padding-left: 14px; }
    .stage .big, .outside .big { font-size: 24px; }
    .stage .lab em { display: none; }
    .body { grid-template-rows: 55vh auto; }
    .chips { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; }
    .chip { flex-shrink: 0; padding: 7px 11px; }
    .row { padding: 12px 14px; }
    .detail { top: 6vh; }
    .parties, .tiles { grid-template-columns: 1fr; }
    .ladder button { padding: 11px 0 11px 8px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="mark"></div>
    <div>
      <h1>FPSO Opportunity Map</h1>
      <div class="sub" id="sub">Loading…</div>
    </div>
    <div class="spacer"></div>
    <div class="picks">
      <label class="pick"><span>List</span><select id="cur"></select></label>
      <label class="pick"><span>Compare with</span><select id="cmp"></select></label>
      <input type="file" id="file" accept=".xlsx,.xls,.csv" hidden>
    </div>
    <button class="hbtn" id="upload" title="Load your own Excel file">⬆ Upload Excel</button>
    <button class="hbtn" id="present">▶ Present</button>
    <button class="hbtn primary" id="export">⬇ Export</button>
  </header>

  <section class="funnel" id="funnel"></section>

  <div class="body">
    <aside>
      <div class="filters">
        <input class="search" id="q" placeholder="Search project, operator, country…">
        <div class="flabel">Region</div>
        <div class="chips" id="regions"></div>
        <div class="flabel">Status</div>
        <div class="chips" id="statuses"></div>
        <div class="flabel cmp-only">Changes since previous list</div>
        <div class="chips cmp-only" id="changes"></div>
      </div>
      <div class="list" id="list"></div>
    </aside>
    <div style="position:relative;min-height:0">
      <div id="map"></div>
      <div class="detail" id="detail"></div>
    </div>
    <div class="legend">
      <svg width="58" height="58" viewBox="0 0 58 58" aria-hidden="true">
        <circle cx="29" cy="29" r="28" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
        <circle cx="29" cy="35" r="19" fill="#c7d2fe" stroke="#4f46e5" stroke-width="1.5"/>
        <circle cx="29" cy="41" r="10" fill="#a7f3d0" stroke="#059669" stroke-width="1.5"/>
        <text x="29" y="13" text-anchor="middle" font-size="7" font-weight="700" fill="#475569">TAM</text>
        <text x="29" y="27" text-anchor="middle" font-size="7" font-weight="700" fill="#3730a3">SAM</text>
        <text x="29" y="44" text-anchor="middle" font-size="7" font-weight="700" fill="#065f46">SOM</text>
      </svg>
      <div>
        <div class="rows">
          <span><i style="--c:var(--som)"></i>Reached SOM</span>
          <span><i style="--c:var(--sam)"></i>Reached SAM</span>
          <span><i style="--c:var(--tam)"></i>TAM only</span>
          <span><i style="--c:#94a3b8;border-style:dashed"></i>Outside TAM</span>
        </div>
        <div class="note">Ring = furthest stage · logo = operator<br>Pin size = EPCI capex</div>
      </div>
    </div>
  </div>
</div>

<div class="dlg" id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlg-title"><div class="box">
  <h3 id="dlg-title"></h3><div id="dlg-body"></div>
  <div class="btns"><button class="ghost" id="dlg-close">Close</button><button id="dlg-retry">Choose another file</button></div>
</div></div>
<div class="toast" id="toast"></div>
<div class="drop" id="drop"><div>Drop the Excel file to load it</div></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
// Funnel stage = how far down TAM → SAM → SOM a project gets. 0 = outside TAM.
const STAGES = ['Out', 'TAM', 'SAM', 'SOM'];
const COLOR = ['#94a3b8', '#94a3b8', '#4f46e5', '#059669'];
const STAGE_LABEL = ['Outside TAM', 'TAM only', 'Reached SAM', 'Reached SOM'];

// Operator / contractor → website domain, used to fetch a logo. A "Logo" column in the sheet overrides this.
const DOMAINS = {
  'Inpex': 'inpex.com', 'Petrobras': 'petrobras.com.br', 'Equinor': 'equinor.com', 'Shell': 'shell.com',
  'Woodside': 'woodside.com', 'Eni': 'eni.com', 'Santos': 'santos.com', 'ExxonMobil': 'exxonmobil.com',
  'Azule Energy': 'azule-energy.com', 'TotalEnergies': 'totalenergies.com', 'Jadestone': 'jadestone-energy.com',
  'Karoon': 'karoonenergy.com.au', 'Mubadala': 'mubadalaenergy.com', 'Altera Infrastructure': 'alterainfra.com', 'Ping (Dagang Nexchange)': 'pingpetroleum.com',

    const s = Math.round((innerWidth < 600 ? .72 : 1) * (30 + Math.sqrt(p.capex / maxCap) * 20));
    const m = L.marker(p.ll, { p, size: s, zIndexOffset: sel === p ? 1000 : p.capex, icon: L.divIcon({ className: '', iconSize: [s, s],
      html: `<div class="pinwrap" style="width:${s}px;height:${s}px"><div class="pin ${p.stage ? '' : 'out'} ${p.dropped ? 'gone' : ''} ${sel === p ? 'sel' : ''}" style="width:${s}px;height:${s}px;--c:${COLOR[p.stage]}">${logo(p.operator || p.name, s - 7)}</div>${(c => c ? `<span class="chg" style="--k:${c.color}">${c.badge}</span>` : '')(changeOf(p))}</div>` }) });
    m.bindTooltip(`<b>${esc(p.name)}</b><div>${esc(p.operator)} · ${STAGE_LABEL[p.stage]} · ${money(p.capex)}</div>${changeOf(p) ? `<div style="color:${changeOf(p).color};font-weight:600">${esc(changeOf(p).text)}</div>` : ''}`, { className: 'tip', direction: 'top', offset: [0, -s / 2] });
    m.on('click', () => select(p));
    pinLayer.addLayer(m); p.m = m;
  });
  if (fit) fitAll();   // zoomend re-runs the layout
  layoutPins();
}

function select(p) {
  sel = p; render();
  const tile = (k, v) => `<div class="tile"><div class="k">${k}</div><div class="val">${v}</div></div>`;
  const party = (k, name, override) => `<div class="party">${name ? logo(name, 38, 'sq', override) : '<span class="logo sq" style="width:38px;height:38px;background:#f1f5f9;color:#94a3b8;font-size:16px">?</span>'}
      <div><div class="k">${k}</div><div class="n ${name ? '' : 'tbd'}">${esc(name || 'Not yet awarded')}</div></div></div>`;
  const extra = Object.entries(p.r).filter(([k, v]) => v !== '' && !k.startsWith('---')).map(([k, v]) => `<span>${esc(k)}</span><span>${esc(v)}</span>`).join('');
  document.getElementById('detail').innerHTML = `
    <div class="dh">
      <div class="top">${logo(p.operator || p.name, 44, 'sq', p.operatorLogo)}
        <div><h2>${esc(p.name)}</h2><div class="loc">${esc(p.country)} · ${esc(p.region)}</div></div>
        <button class="x" onclick="closeD()">×</button></div>
      ${p.dropped ? `<div class="gonebar">Dropped: this project was in the previous list but is not in the current one. Details below are from the previous list.</div>` : `
      <div class="flab"><span>Furthest funnel stage</span><kbd>keys 0–3</kbd></div>
      <div class="ladder">${STAGES.map((n, k) => `<button class="${k === 0 ? 'out' : ''} ${(k === 0 ? p.stage === 0 : p.stage >= k) ? 'f' : ''}" style="--c:${COLOR[k] === '#94a3b8' ? '#64748b' : COLOR[k]}" onclick="setStage(${k})">${n}</button>`).join('')}</div>
      <div class="ticks">${['TAM', 'SAM', 'SOM'].map((n, j) => `<span>${n} <b>${p.stage > j ? '✓' : '—'}</b></span>`).join('')}</div>`}
    </div>
    <div class="db">
      ${prev && !p.dropped ? (prevById[p.id] ? (d => d.length
        ? `<div class="since"><div class="h">Since previous list</div>${d.map(x => `<div class="d"><span>${esc(x.label)}</span><span><s>${esc(x.from)}</s> → <b>${esc(x.to)}</b></span></div>`).join('')}</div>`
        : `<div class="since none">No changes since previous list.</div>`)(diffOf(p))
        : `<div class="since" style="background:#e0f2fe"><div class="h" style="color:#0369a1">New since previous list</div><div style="font-size:12px">Not in ${esc(prevFile)}.</div></div>`) : ''}
      <div class="parties">${party('Operator', p.operator, p.operatorLogo)}${party('FPSO contractor', p.contractor, p.contractorLogo)}</div>
      <span class="status">${esc(p.status)}</span>
      <div class="tiles" style="margin-top:12px">
        ${tile('EPCI capex', money(p.capex))}${tile('Hull award', esc(p.award))}
        ${tile('First oil / install', esc(p.install))}${tile('Water depth (m)', esc(p.depth))}
        ${tile('Product', esc(p.product))}${tile('Hull', esc(p.build))}
      </div>
      <div class="sect">Meeting notes</div>
      <textarea placeholder="Why this stage? Next action, owner…" oninput="sel.notes = this.value; markDirty()">${esc(p.notes)}</textarea>
      <details><summary>All source fields</summary><div class="kv">${extra}</div></details>
    </div>
    <div class="df"><span>→ next project · Esc close</span><button onclick="next()">Next project →</button></div>`;
  document.getElementById('detail').classList.add('on');
  map.flyTo(p.ll, Math.max(map.getZoom(), 4), { duration: .6 });
}
function setStage(k) { if (!sel || sel.dropped || sel.stage === k) return; sel.stage = k; markDirty(); buildChips(); select(sel); }
function closeD() { sel = null; document.getElementById('detail').classList.remove('on'); render(); }
function next() { const v = visible(); if (!v.length) return; select(v[(v.indexOf(sel) + 1) % v.length]); }

document.getElementById('list').onclick = e => { const r = e.target.closest('.row'); if (r) select(projects.find(p => p.i == r.dataset.i)); };
document.getElementById('funnel').onclick = e => { const el = e.target.closest('[data-s]'); if (!el) return; const k = +el.dataset.s; filt.stage = filt.stage === k ? null : k; render(); };
document.getElementById('q').oninput = e => { filt.q = e.target.value.toLowerCase(); render(); };
// List / Compare pickers. "Upload Excel file…" opens the file chooser for whichever picker asked.
const curSel = document.getElementById('cur'), cmpSel = document.getElementById('cmp'), fileIn = document.getElementById('file');
const opts = extra => DATASETS.map(d => `<option value="${d.file}">${esc(d.label)}</option>`).join('') + extra + `<option value="${UPLOAD}">Upload Excel file…</option>`;
curSel.innerHTML = opts('');
cmpSel.innerHTML = '<option value="">Off</option>' + opts('');
let uploadFor = null, lastCur = DATASETS[0].file, lastCmp = '';
function addUploaded(selEl, file) {
  const o = document.createElement('option'); o.value = 'upload:' + file.name; o.textContent = file.name + ' (uploaded)'; o.file = file;
  selEl.insertBefore(o, selEl.querySelector(`[value="${UPLOAD}"]`)); selEl.value = o.value; return o;
}
curSel.onchange = () => {
  if (curSel.value === UPLOAD) { uploadFor = 'cur'; curSel.value = lastCur; return fileIn.click(); }
  if (dirty && !confirm('You have edits that are not exported. Switch lists and lose them?')) { curSel.value = lastCur; return; }
  const want = curSel.value;
  curSel.value = lastCur;
  load(curSel.querySelector(`option[value="${CSS.escape(want)}"]`).file || want).then(ok => { if (ok) curSel.value = lastCur = want; });
};
cmpSel.onchange = () => {
  if (cmpSel.value === UPLOAD) { uploadFor = 'cmp'; cmpSel.value = lastCmp; return fileIn.click(); }
  const want = cmpSel.value;
  cmpSel.value = lastCmp;
  setCompare(cmpSel.querySelector(`option[value="${CSS.escape(want)}"]`).file || want).then(ok => { if (ok) cmpSel.value = lastCmp = want; });
};
async function openCurrent(f) {
  if (dirty && !confirm('You have edits that are not exported. Load this file and lose them?')) return;
  if (await load(f)) lastCur = addUploaded(curSel, f).value;
}
function showDialog({ title, body, retry }) {
  document.getElementById('dlg-title').innerHTML = title;
  document.getElementById('dlg-body').innerHTML = body;
  document.getElementById('dlg-retry').style.display = retry ? '' : 'none';
  document.getElementById('dlg').classList.add('on');
  document.getElementById(retry ? 'dlg-retry' : 'dlg-close').focus();
}
const closeDialog = () => document.getElementById('dlg').classList.remove('on');
document.getElementById('dlg-close').onclick = closeDialog;
document.getElementById('dlg-retry').onclick = () => { closeDialog(); uploadFor = 'cur'; fileIn.click(); };
document.getElementById('dlg').onclick = e => { if (e.target.id === 'dlg') closeDialog(); };
let toastTimer;
function toast(html) {
  const t = document.getElementById('toast'); t.innerHTML = html; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 9000);
}
document.getElementById('toast').onclick = e => e.currentTarget.classList.remove('on');
document.getElementById('upload').onclick = () => { uploadFor = 'cur'; fileIn.click(); };
let dragDepth = 0;
const isFileDrag = e => [...(e.dataTransfer?.types || [])].includes('Files');
addEventListener('dragenter', e => { if (isFileDrag(e)) { dragDepth++; document.body.classList.add('dragging'); } });
addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); } });
addEventListener('dragover', e => { if (isFileDrag(e)) e.preventDefault(); });
addEventListener('drop', e => {
  if (!isFileDrag(e)) return;
  e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging');
  const f = e.dataTransfer.files[0];
  if (f && /\.(xlsx|xls|csv)$/i.test(f.name)) openCurrent(f); else if (f) alert('Please drop an Excel (.xlsx, .xls) or CSV file.');
});
fileIn.onchange = () => {
  const f = fileIn.files[0]; fileIn.value = '';
  if (!f) return;
  if (uploadFor === 'cur') return openCurrent(f);
  setCompare(f).then(ok => { if (ok) lastCmp = addUploaded(cmpSel, f).value; });
};
// Export: one workbook with the updated list, the untouched original, a funnel summary,
// and (in compare mode) what changed since the previous list.
function exportWorkbook() {
  const byRow = new Map(current.map(p => [p.r, p]));
  const yn = on => on ? 'Yes' : 'No';
  // Original columns are copied as-is; edits go into "Updated: …" columns at the end (replaced, not duplicated, on re-export).
  const updated = originalRows.map(r => {
    const p = byRow.get(r), out = { ...r };
    if (!p) return out;                       // rows without a valid location are kept unchanged
    const what = [];
    if (p.stage !== p.stage0) what.push(`Stage: ${STAGES[p.stage0]} → ${STAGES[p.stage]}`);
    if (p.notes !== p.notes0) what.push('Notes edited');
    out[U('Funnel stage')] = STAGE_LABEL[p.stage];
    out[U('TAM')] = yn(p.stage >= 1);
    out[U('SAM')] = yn(p.stage >= 2);
    out[U('SOM')] = yn(p.stage >= 3);
    out[U('Notes')] = p.notes;
    out[U('What changed')] = what.join('; ');
    return out;
  });
  const cap = set => Math.round(set.reduce((s, p) => s + p.capex, 0));
  const reached = k => current.filter(p => p.stage >= k);
  const summary = [
    { Stage: 'TAM', Projects: reached(1).length, 'EPCI capex ($M)': cap(reached(1)), 'Previous list': prev ? prev.filter(p => p.stage >= 1).length : '' },
    { Stage: 'SAM', Projects: reached(2).length, 'EPCI capex ($M)': cap(reached(2)), 'Previous list': prev ? prev.filter(p => p.stage >= 2).length : '' },
    { Stage: 'SOM', Projects: reached(3).length, 'EPCI capex ($M)': cap(reached(3)), 'Previous list': prev ? prev.filter(p => p.stage >= 3).length : '' },
    { Stage: 'Outside TAM', Projects: current.filter(p => p.stage === 0).length, 'EPCI capex ($M)': '', 'Previous list': prev ? prev.filter(p => p.stage === 0).length : '' }
  ];
  const wb = XLSX.utils.book_new();
  const sheet = (rows, name, widths) => { const ws = XLSX.utils.json_to_sheet(rows); if (widths) ws['!cols'] = widths.map(w => ({ wch: w })); XLSX.utils.book_append_sheet(wb, ws, name); };
  const ws = XLSX.utils.json_to_sheet(updated);
  ws['!autofilter'] = { ref: ws['!ref'] };   // filter arrows on the header row, e.g. to show only changed rows
  XLSX.utils.book_append_sheet(wb, ws, 'Updated list');
  sheet(summary, 'Funnel summary', [14, 10, 16, 14]);
  if (prev) sheet(projects.map(p => ({ p, c: changeOf(p) })).filter(x => x.c).map(({ p, c }) => ({
    'OED ID': p.id, Project: p.name, Operator: p.operator, Change: c.kind, Detail: p.dropped || !prevById[p.id] ? c.text : diffOf(p).map(d => `${d.label}: ${d.from} → ${d.to}`).join('; ')
  })), 'Changes vs previous', [10, 34, 16, 10, 60]);
  sheet(originalRows.map(r => Object.fromEntries(Object.entries(r).filter(([k]) => !k.startsWith('Updated: ')))), 'Original (unchanged)');
  dirty = false; setSub();
  XLSX.writeFile(wb, `FPSO_funnel_${currentFile.replace(/\.xlsx?$/i, '')}_${new Date().toISOString().slice(0, 10)}.xlsx`);
}
document.getElementById('export').onclick = exportWorkbook;
document.getElementById('present').onclick = e => { document.body.classList.toggle('present'); e.target.textContent = document.body.classList.contains('present') ? '✎ Edit' : '▶ Present';
  setTimeout(() => { map.invalidateSize(); fitAll(); }, 50); };
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
  if ('0123'.includes(e.key) && sel) setStage(+e.key);
  if (e.key === 'ArrowRight') next();
  if (e.key === 'Escape') { if (document.getElementById('dlg').classList.contains('on')) return closeDialog(); closeD(); }
});
load(DATASETS[0].file);
</script>
</body>
</html>
